  <script data-v="20261121.5">
  (function(){
    document.querySelector(".skip-link").href = location.href.split("#")[0] + "#main";
    var tag=document.currentScript, here=tag&&tag.dataset.v;
    var link=document.querySelector('link[rel="stylesheet"][href*="site.css"]');
    if(!here||!link) return;
    var root=link.href.replace(/assets\/site\.css.*$/,"");
    fetch(root+"version.json",{cache:"no-store"}).then(function(r){return r.json()}).then(function(d){
      if(!d||!d.assets||d.assets===here) return;
      if(sessionStorage.getItem("v-reload")===d.assets) return;
      sessionStorage.setItem("v-reload",d.assets);
      location.reload();
    }).catch(function(){});
  })();
  </script>
